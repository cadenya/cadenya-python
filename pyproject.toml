[project]
name = "cadenya"
version = "1.0.0"
description = "The official Python SDK for the Cadenya API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "typing_extensions>=4.0"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://cadenya.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadenya"]

# The README (PyPI long description) refers to the full reference; ship it
# inside the package so the pointer resolves for installed users.
[tool.hatch.build.targets.wheel.force-include]
"api.md" = "cadenya/api.md"
